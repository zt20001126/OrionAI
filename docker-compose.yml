services:
  backend:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    command:
      - sh
      - -c
      - alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-include '*.md'
    environment:
      ENVIRONMENT: development
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in the project .env}
      CHECKPOINT_DATABASE_URL: ${CHECKPOINT_DATABASE_URL:?CHECKPOINT_DATABASE_URL must be set in the project .env}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:5173"]'
      AUTH_CODE_PEPPER: ${AUTH_CODE_PEPPER:-}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID:-}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET:-}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-}
      ALIYUN_OSS_BUCKET: ${ALIYUN_OSS_BUCKET:-}
      ALIYUN_OSS_OBJECT_PREFIX: ${ALIYUN_OSS_OBJECT_PREFIX:-orionai}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY must be set in the project .env}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:?DEEPSEEK_MODEL must be set in the project .env}
      SNOWFLAKE_WORKER_ID: ${SNOWFLAKE_WORKER_ID:-1}
      TENCENT_TOKENHUB_API_KEY: ${TENCENT_TOKENHUB_API_KEY:?TENCENT_TOKENHUB_API_KEY must be set in the project .env}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  celery-worker:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    command:
      - python
      - -m
      - celery
      - -A
      - app.core.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=reminders,memory_training
      - --pool=solo
    environment:
      ENVIRONMENT: development
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in the project .env}
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      ALIYUN_BAILIAN_API_KEY: ${ALIYUN_BAILIAN_API_KEY:?ALIYUN_BAILIAN_API_KEY must be set in the project .env}
      ALIYUN_BAILIAN_BASE_URL: ${ALIYUN_BAILIAN_BASE_URL:?ALIYUN_BAILIAN_BASE_URL must be set in the project .env}
      ALIYUN_BAILIAN_MODEL: ${ALIYUN_BAILIAN_MODEL:-qwen3.8-flash}
      SNOWFLAKE_WORKER_ID: "2"
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    command:
      - python
      - -m
      - celery
      - -A
      - app.core.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/orionai-celerybeat-schedule
    environment:
      ENVIRONMENT: development
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in the project .env}
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SNOWFLAKE_WORKER_ID: "3"
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "/postgres-entrypoint.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_DB: orionai
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in the project .env}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/docker/postgres-entrypoint.sh:/postgres-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orionai -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
